[project]
name = "mackay-information-theory"
version = "0.1.0"
description = "Programming exercises for Information Theory"
readme = "README.md"
authors = [
    { name = "Vikram Pawar", email = "pvikram035@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
